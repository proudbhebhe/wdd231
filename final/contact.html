<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Proud Bhebhe">
    <meta name="description" content="Contact Urban Wings or apply for a membership program.">
    <meta property="og:title" content="Urban Wings | Contact">
    <meta property="og:description" content="Get in touch with Urban Wings today.">
    <meta property="og:image" content="images/hero.jpg">
    <meta property="og:url" content="https://alphatron.dev/urbanwings/contact.html">
    <title>Urban Wings | Contact</title>
    <link rel="icon" href="images/logo.png">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/large.css">
    <script src="scripts/base.js" defer></script>
</head>
<body>
    <header>
        <a href="index.html"><img src="images/logo.png" alt="Urban Wings company logo"></a>
        <span>Urban Wings</span>
        <button id="hamButton" aria-label="Toggle navigation menu">🍔</button>
        <nav id="navBar" class="navigation">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a class="active" href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <div class="display">
            <div>
                <h2>Membership Application Form</h2>
                <form method="get" action="thankyou.html" class="transform">
                    <label for="firstName">First Name</label>
                    <input name="firstName" id="firstName" type="text" placeholder="John" autocomplete="given-name" title="Your First Name" required>
                    
                    <label for="phone">Phone</label>
                    <input type="tel" name="phone" id="phone" placeholder="263 78 987 6543" title="A phone number with dashes" autocomplete="tel" required>
                    
                    <label for="description">Message Description</label>
                    <textarea id="description" title="My Description" name="description"></textarea>
                    
                    <input type="hidden" name="timestamp" id="timestamp">
                    
                    <button id="submit" type="submit">Apply for Membership</button>
                </form>
            </div>
        </div>
    </main>
    <footer>
        <div>
            <p>23 Salamat Mall</p>
            <p>9th Avenue and George Silunduka Street</p>
        </div>
        <div class="socials">
            <a href="https://facebook.com" target="_blank"><img src="images/facebook_icon.svg" alt="Facebook icon"></a>
            <a href="https://instagram.com" target="_blank"><img src="images/instagram_icon.svg" alt="Instagram logo"></a>
            <a href="https://twitter.com" target="_blank"><img src="images/x-icon.png" alt="X logo"></a>
        </div>
        <div>
            <p>WDD 231</p>
            <p>Proud Bhebhe</p>
            <a href="https://youtube.com/YOUR_VIDEO_LINK">Project Video</a>
        </div>
    </footer>
</body>
</html>
